<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="color-scheme" content="light only">
    <title>Portal</title>
    <link rel="icon" type="image/png" href="/apps/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/ui-refined.css">
    <link rel="stylesheet" href="/portal/m/styles.css">
</head>
<body>

<div class="portal-mobile" id="portalMobile">

    <main class="content">
        <div id="iframesContainer"></div>
    </main>

    <nav class="bottom-bar" aria-label="Módulos">
        <div class="carousel" id="carousel" role="tablist"></div>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </nav>

</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
    <header class="drawer-header">
        <div class="avatar" id="userInitial">?</div>
        <div class="drawer-info">
            <div class="drawer-name" id="userName">—</div>
            <div class="drawer-sector" id="userSector">—</div>
        </div>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="Fechar">✕</button>
    </header>

    <nav class="drawer-nav" id="drawerNav"></nav>

    <footer class="drawer-footer">
        <button class="drawer-logout" id="drawerLogout" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
        </button>
    </footer>
</aside>

<div class="greeting" id="greeting">
    <div class="greeting-text" id="greetingText"></div>
</div>

<script src="/shared/ir-common.js"></script>
<script src="/portal/m/script.js"></script>
</body>
</html>
