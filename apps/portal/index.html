<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal · I.R. Comércio</title>
    <link rel="icon" type="image/png" href="/apps/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/portal/styles.css">
    <link rel="stylesheet" href="/shared/ui-refined.css">
<style>
/* Ajustes transversais: desktop, modais e conteúdo sem cortes */
:root { --primary: #ff521d; --warning-color: #ff521d; --btn-view: #ff521d; }
html, body { width:100%; min-width:0; max-width:100%; }
body { overflow-x:auto; }
.container, .app-content, main, .main-content { max-width:100%; }
.modal-overlay { padding:clamp(10px, 2vw, 28px); }
.modal-content { max-width:min(96vw, 1100px); max-height:92vh; overflow:auto; }
.modal-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.modal-actions button.danger, .modal-actions button.cancel-close, .modal-actions button.cancel, .modal-actions button[onclick*="closeFormModal"], .modal-actions button[onclick*="closeModal"] { background:#dc2626 !important; color:#fff !important; }
.modal-actions button.success, .modal-actions button[onclick*="confirmDelete"], .modal-actions button[onclick*="confirmLogout"] { background:#16a34a !important; color:#fff !important; }
input[readonly], textarea[readonly], select:disabled { cursor:not-allowed !important; }
.form-grid > .form-group, .form-row > .form-group { min-width:0; }
input, select, textarea { max-width:100%; }
table { max-width:100%; }
.table-container, .table-wrapper, .table-responsive { max-width:100%; overflow-x:auto; }
#unsupportedDevice { display:none; }
@media (max-width: 767px) { body > *:not(#unsupportedDevice) { display:none !important; } #unsupportedDevice { position:fixed; inset:0; z-index:2147483647; display:flex; align-items:center; justify-content:center; padding:28px; background:#fff; color:#111827; text-align:center; font:600 18px/1.5 system-ui,sans-serif; } }
</style>
</head>
<body>

<div class="dashboard" id="dashboard">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="avatar" id="userInitial"></div>
            <div class="sidebar-info">
                <div class="sidebar-name" id="userName"></div>
                <div class="sidebar-sector" id="userSector"></div>
            </div>
        </div>

        <nav class="sidebar-nav" id="sidebarModules"></nav>

        <div class="sidebar-footer">
            <button class="module-item logout-item" onclick="showLogout()" type="button">
                <span class="module-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </span>
                <span class="module-label">Sair</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div id="iframesContainer"></div>
    </main>

    <!-- Saudação sobre o dashboard enquanto o primeiro módulo carrega -->
    <div class="greeting-overlay" id="greetingOverlay">
        <div class="greeting-text" id="greetingText"></div>
    </div>
</div>

<div class="modal-overlay" id="logoutModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeLogout()">✕</button>
        <div class="modal-message">Deseja realmente sair?</div>
        <div class="modal-actions">
            <button class="danger" onclick="confirmLogout()">Sim</button>
            <button class="secondary" onclick="closeLogout()">Cancelar</button>
        </div>
    </div>
</div>

<script src="/portal/script.js"></script>
<div id="unsupportedDevice" role="alert">Este dispositivo não é compatível com este sistema.</div>
</body>
</html>
