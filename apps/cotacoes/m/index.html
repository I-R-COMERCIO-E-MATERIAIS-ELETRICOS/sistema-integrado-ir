<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F7">
    <meta name="color-scheme" content="light only">
    <title>Cotações de Frete</title>
    <link rel="icon" type="image/png" href="/apps/imagens/IR%20ICONE.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/cotacoes/m/styles.css">
    <script>
        const PORTAL_URL = window.location.origin;
        const DEVELOPMENT_MODE = false;
    </script>
</head>
<body>

<div class="search-bar">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="search" id="searchInput" placeholder="Pesquisar transportadora, documento..." autocomplete="off">
</div>

<div class="filters">
  <select id="filterTransportadora" class="filter-select">
    <option value="">Transportadora</option>
  </select>
  <select id="filterResponsavel" class="filter-select">
    <option value="">Responsável</option>
  </select>
  <select id="filterStatus" class="filter-select">
    <option value="">Todos os Status</option>
    <option value="aprovada">Aprovada</option>
    <option value="reprovada">Reprovada</option>
  </select>
</div>

<div class="month-nav">
  <button type="button" id="monthPrev" class="month-arrow" aria-label="Mês anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button type="button" id="calendarBtn" class="month-display" aria-label="Selecionar mês">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span id="currentMonth">Carregando...</span>
  </button>
  <button type="button" id="monthNext" class="month-arrow" aria-label="Próximo mês">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<div class="list" id="list"></div>

<div class="empty-state" id="emptyState" hidden>
  <div class="empty-title">Nenhuma cotação encontrada</div>
  <div class="empty-desc">Toque em <b>+</b> para cadastrar.</div>
</div>

<div class="fab-group">
  <div class="icons-row">
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sincronizar" title="Sincronizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
      </svg>
    </button>
  </div>
  <button class="fab-register" id="addBtn" type="button" aria-label="Nova Cotação" title="Nova Cotação">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<!-- MODAL: FORM -->
<div class="modal" id="formModal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title" id="formTitle">Nova Cotação</h2>
      <button class="modal-close" data-close="formModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab active" data-tab="geral" type="button">Geral</button>
      <button class="modal-tab" data-tab="transportadora" type="button">Transportadora</button>
      <button class="modal-tab" data-tab="observacoes" type="button">Observações</button>
    </div>
    <form id="cotacaoForm" class="modal-body">
      <input type="hidden" id="editId" value="">

      <section class="tab-pane active" data-pane="geral">
        <div class="field"><label>Data da Cotação</label><input type="text" id="dataCotacao" placeholder="DD/MM/YYYY"></div>
        <div class="field"><label>Documento</label><input type="text" id="documento" placeholder="Nº do documento"></div>
        <div class="field"><label>Nº da Cotação</label><input type="text" id="numeroCotacao" placeholder="Nº da cotação"></div>
        <div class="field"><label>Destino</label><input type="text" id="destino" placeholder="Cidade / Estado"></div>
        <div class="field"><label>Responsável</label><input type="text" id="responsavel" readonly></div>
        <div class="field"><label>Vendedor</label><select id="vendedor"><option value="">Selecione...</option></select></div>
      </section>

      <section class="tab-pane" data-pane="transportadora">
        <div class="field"><label>Transportadora *</label><select id="transportadora" required><option value="">Selecione...</option></select></div>
        <div class="field"><label>Atendente</label><input type="text" id="responsavelTransportadora" placeholder="Nome do atendente"></div>
        <div class="field">
          <label>Canal de Comunicação</label>
          <select id="canalComunicacao">
            <option value="">Selecione...</option>
            <option>WhatsApp</option>
            <option>Site</option>
            <option>Email</option>
            <option>Telefone</option>
          </select>
        </div>
        <div class="field"><label>Código de Coleta</label><input type="text" id="codigoColeta" placeholder="Código"></div>
        <div class="field"><label>Valor do Frete (R$)</label><input type="number" id="valorFrete" min="0" step="0.01" placeholder="0.00"></div>
        <div class="field"><label>Previsão de Entrega</label><input type="text" id="previsaoEntrega" placeholder="DD/MM/YYYY"></div>
      </section>

      <section class="tab-pane" data-pane="observacoes">
        <div class="observacoes-list" id="observacoesList"></div>
        <div class="nova-observacao">
          <textarea id="novaObservacao" rows="3" placeholder="Digite sua observação aqui..."></textarea>
          <button type="button" class="btn-add-obs" id="btnAddObs">Adicionar Observação</button>
        </div>
        <input type="hidden" id="observacoes">
      </section>
    </form>
    <footer class="modal-foot">
      <button class="btn btn-green" id="btnSave" type="submit" form="cotacaoForm">Salvar</button>
      <button class="btn btn-red" data-close="formModal" type="button">Cancelar</button>
    </footer>
  </div>
</div>

<!-- MODAL: VIEW -->
<div class="modal" id="viewModal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title">Cotação <span id="viewDoc"></span></h2>
      <button class="modal-close" data-close="viewModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab active" data-vtab="vgeral" type="button">Geral</button>
      <button class="modal-tab" data-vtab="vtransp" type="button">Transportadora</button>
      <button class="modal-tab" data-vtab="vobs" type="button">Observações</button>
    </div>
    <div class="modal-body">
      <div class="tab-pane active" data-vpane="vgeral" id="vgeral"></div>
      <div class="tab-pane" data-vpane="vtransp" id="vtransp"></div>
      <div class="tab-pane" data-vpane="vobs" id="vobs"></div>
    </div>
    <footer class="modal-foot">
      <button class="btn btn-red" data-close="viewModal" type="button">Fechar</button>
    </footer>
  </div>
</div>

<!-- MODAL: DELETE -->
<div class="modal" id="deleteModal" aria-hidden="true">
  <div class="modal-box modal-confirm" role="dialog" aria-modal="true">
    <button class="modal-close ir-close" data-close="deleteModal" type="button" aria-label="Fechar">✕</button>
    <div class="confirm-msg" id="deleteMsg">Tem certeza que deseja excluir esta cotação?</div>
    <div class="confirm-actions">
      <button class="btn btn-green" id="confirmDeleteBtn" type="button">Sim</button>
      <button class="btn btn-red" data-close="deleteModal" type="button">Não</button>
    </div>
  </div>
</div>

<!-- MODAL: CALENDAR -->
<div class="modal" id="calendarModal" aria-hidden="true">
  <div class="modal-box modal-calendar" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title">Selecionar Mês</h2>
      <button class="modal-close" data-close="calendarModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="calendar-header">
      <button type="button" id="calendarPrevYear" class="calendar-year-nav" aria-label="Ano anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h3 id="calendarYear">2026</h3>
      <button type="button" id="calendarNextYear" class="calendar-year-nav" aria-label="Próximo ano">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="calendar-months" id="calendarMonths"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/ir-common.js"></script>
<script src="/cotacoes/m/script.js"></script>
</body>
</html>
