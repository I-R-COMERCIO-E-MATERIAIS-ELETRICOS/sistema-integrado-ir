<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="icon" type="image/png" href="/apps/imagens/IR%20ICONE.png">
    <link rel="stylesheet" href="/estoque/styles.css">
    <link rel="stylesheet" href="/shared/ui-refined.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-content">
        <div class="container">
            <div class="header">
                <div class="header-left"><h1>Estoque</h1></div>
                <button onclick="openFormModal(null)" class="btn-new-order-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Novo Item
                </button>
            </div>

            <div class="search-bar-wrapper">
                <div class="search-bar">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search" placeholder="Buscar por ID, descrição, marca ou modelo..." oninput="filterItems()">

                    <div class="search-bar-filters">
                        <div class="filter-dropdown-inline">
                            <select id="filterMarca" onchange="selecionarMarca(this.value)">
                                <option value="">Todas as Marcas</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="filter-dropdown-inline">
                            <select id="filterGrupo" onchange="selecionarGrupo(this.value)">
                                <option value="">Todos os Grupos</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>

                    <button class="sync-btn doc-btn" onclick="gerarPDFEstoque()" title="Gerar PDF do estoque">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </button>
                    <button class="sync-btn" onclick="sincronizarDados()" title="Sincronizar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="card table-card">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descrição</th>
                                <th>Grupo</th>
                                <th>Valor Unitário</th>
                                <th>Quantidade</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="estoqueTableBody"></tbody>
                    </table>
                </div>
                <div class="estoque-totals" id="totalsBar">
                    <div class="totals-item">
                        <span>QUANTIDADE TOTAL</span>
                        <strong id="totalQtd">0</strong>
                    </div>
                    <div class="totals-item">
                        <span>VALOR TOTAL</span>
                        <strong id="totalValor">R$ 0,00</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/shared/ir-common.js"></script>
    <script src="/estoque/script.js"></script>
    <div id="unsupportedDevice" role="alert">Este dispositivo não é compatível com este sistema.</div>
</body>
</html>
