<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1120">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ordem de Compra · MALVSCODE</title>

    <link rel="icon" type="image/png" href="/compra/I.R.-COMERCIO-E-MATERIAIS-ELETRICOS-PRETO.png">
    <link rel="stylesheet" href="/compra/m/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
        const PORTAL_URL = window.location.origin;
        const DEVELOPMENT_MODE = false;
    </script>
</head>
<body class="mobile">

    <!-- Header fixo -->
    <header class="app-header" id="appHeader">
        <button class="header-btn" id="menuToggleBtn" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <h1 class="header-title" id="headerTitle">Ordens de Compra</h1>
        <button class="header-btn" id="headerActionBtn" aria-label="Nova ordem"></button>
    </header>

    <!-- Menu lateral -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <span class="drawer-logo">MALVS<span>CODE</span></span>
            <button class="header-btn" id="drawerCloseBtn" aria-label="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <nav class="drawer-nav" id="drawerNav"></nav>
    </aside>

    <!-- Conteúdo principal -->
    <main class="app-main" id="appMain">

        <!-- Dashboard -->
        <div class="page">
            <div class="stats-strip">
                <div class="stat-mini default">
                    <div class="stat-mini-value" id="totalOrdensMobile">0</div>
                    <div class="stat-mini-label">Total</div>
                </div>
                <div class="stat-mini success">
                    <div class="stat-mini-value" id="totalFechadasMobile">0</div>
                    <div class="stat-mini-label">Fechadas</div>
                </div>
                <div class="stat-mini warning">
                    <div class="stat-mini-value" id="totalAbertasMobile">0</div>
                    <div class="stat-mini-label">Abertas</div>
                </div>
                <div class="stat-mini info">
                    <div class="stat-mini-value" id="valorTotalMobile">R$ 0</div>
                    <div class="stat-mini-label">Total Mês</div>
                </div>
            </div>

            <!-- Mês -->
            <div class="month-nav">
                <button class="month-nav-btn" onclick="changeMonth(-1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="month-nav-label" id="currentMonth">Carregando…</div>
                <button class="month-nav-btn" onclick="changeMonth(1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <!-- Busca + filtros -->
            <div class="search-row">
                <div class="search-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="search" placeholder="Pesquisar…" oninput="filterOrdens()">
                </div>
                <button class="filter-toggle-btn" id="filterToggleBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                </button>
            </div>

            <!-- Painel de filtros -->
            <div class="filters-panel" id="filtersPanel">
                <div class="filter-field">
                    <label>Responsável</label>
                    <select id="filterResponsavel" onchange="filterOrdens()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Status</label>
                    <select id="filterStatus" onchange="filterOrdens()">
                        <option value="">Todos</option>
                        <option value="aberta">Aberta</option>
                        <option value="fechada">Fechada</option>
                    </select>
                </div>
                <div class="filters-actions">
                    <button class="btn-clear-filters" onclick="limparFiltros()">Limpar</button>
                </div>
            </div>

            <!-- Lista de ordens (cards) -->
            <div class="cards-list" id="ordensContainer"></div>
        </div>

    </main>

    <!-- FAB Nova Ordem -->
    <button class="fab" onclick="openFormModal()" aria-label="Nova ordem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- MODAL DE VISUALIZAÇÃO (info) -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Ordem Nº <span id="modalNumero"></span></h3>
                <button class="close-modal" onclick="closeInfoModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchInfoTab('info-tab-geral')">Geral</button>
                    <button class="tab-btn" onclick="switchInfoTab('info-tab-fornecedor')">Fornecedor</button>
                    <button class="tab-btn" onclick="switchInfoTab('info-tab-pedido')">Pedido</button>
                    <button class="tab-btn" onclick="switchInfoTab('info-tab-entrega')">Entrega</button>
                    <button class="tab-btn" onclick="switchInfoTab('info-tab-pagamento')">Pagamento</button>
                </div>
                <div class="tab-content active" id="info-tab-geral"></div>
                <div class="tab-content" id="info-tab-fornecedor"></div>
                <div class="tab-content" id="info-tab-pedido"></div>
                <div class="tab-content" id="info-tab-entrega"></div>
                <div class="tab-content" id="info-tab-pagamento"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btnInfoPrevious" onclick="previousInfoTab()" class="secondary" style="display: none;">Anterior</button>
                <button type="button" id="btnInfoNext" onclick="nextInfoTab()" class="secondary">Próximo</button>
                <button type="button" id="btnInfoClose" onclick="closeInfoModal()" class="secondary">Fechar</button>
            </div>
        </div>
    </div>

    <div id="formModalRoot"></div>
    <div id="deleteModalRoot"></div>
    <div id="duplicarModalRoot"></div>

    <script src="/compra/m/script.js"></script>
</body>
</html>
