<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F7">
  <meta name="color-scheme" content="light only">
  <title>Contas a Pagar</title>
  <link rel="icon" type="image/png" href="/apps/imagens/IR%20ICONE.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS crítico inline: mata qualquer herança de estilo global -->
  <style>
    .search-icon { width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;max-width:18px!important;max-height:18px!important;flex-shrink:0!important }
    .month-arrow,.month-display,.icon-btn,.modal-close,.modal-tab,.btn,.calendar-year-nav,.calendar-btn,.check-btn,.month-nav-arrow { background:transparent!important;border:none!important;box-shadow:none!important }
    .btn-green{background:#22C55E!important;color:#fff!important}
    .btn-red{background:#dc2626!important;color:#fff!important}
    .btn-blue{background:#3B82F6!important;color:#fff!important}
    .fab-add{background:#3B82F6!important;color:#fff!important}
    .action-btn.edit{background:#6B7280!important;color:#fff!important}
    .action-btn.delete{background:#EF4444!important;color:#fff!important}
    .calendar-month.current{background:#FF521D!important;color:#fff!important}
    .filter-select{appearance:none!important;-webkit-appearance:none!important}
    .check-btn.checked{background:#22C55E!important;border-color:#22C55E!important}
  </style>

  <link rel="stylesheet" href="/pagar/m/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="mobile-pagar-app">

<div class="app-shell">

  <!-- Busca -->
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="search" placeholder="Descrição, documento, banco..." autocomplete="off">
  </div>

  <!-- Filtros -->
  <div class="filters">
    <select id="filterBanco" class="filter-select"><option value="">Banco</option></select>
    <select id="filterPagamento" class="filter-select"><option value="">Forma</option></select>
    <select id="filterStatus" class="filter-select"><option value="">Status</option></select>
  </div>

  <!-- Navegação de mês -->
  <div class="month-nav">
    <button type="button" id="monthPrev" class="month-arrow" aria-label="Mês anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" id="calendarBtn" class="month-display" aria-label="Selecionar mês">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span id="currentMonth">Carregando...</span>
    </button>
    <button type="button" id="monthNext" class="month-arrow" aria-label="Próximo mês">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-grid">
    <div class="stat-card stat-success">
      <div class="stat-value" id="statPagos">R$ 0,00</div>
      <div class="stat-label">Pagos</div>
    </div>
    <div class="stat-card stat-danger" id="cardVencido">
      <div class="stat-value" id="statVencido">0</div>
      <div class="stat-label">Vencido</div>
      <div class="pulse-badge" id="pulseBadge" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
    </div>
    <div class="stat-card stat-warning">
      <div class="stat-value" id="statPendente">R$ 0,00</div>
      <div class="stat-label">Pendente</div>
    </div>
    <div class="stat-card stat-total">
      <div class="stat-value" id="statValorTotal">R$ 0,00</div>
      <div class="stat-label">Total</div>
    </div>
  </div>

  <div class="contas-list" id="contasList"></div>

  <div class="empty-state" id="emptyState" hidden>
    <div class="empty-title">Nenhuma conta encontrada</div>
    <div class="empty-desc">Toque em <b>+</b> para registrar.</div>
  </div>
</div>

<!-- FABs -->
<div class="fab-group">
  <div class="icons-row">
    <button class="icon-btn" id="pdfBtn" type="button" aria-label="Gerar PDF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
    </button>
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sincronizar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
      </svg>
    </button>
  </div>
  <button class="fab-add" id="addBtn" type="button" aria-label="Nova Conta">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/ir-common.js"></script>
<script src="/pagar/m/script.js"></script>
</body>
</html>
