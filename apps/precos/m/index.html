<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F7">
    <meta name="color-scheme" content="light only">
    <title>Tabela de Preços</title>
    <link rel="icon" type="image/png" href="/apps/imagens/IR%20ICONE.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/precos/m/styles.css">
</head>
<body>

<div class="search-bar">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="search" id="searchInput" placeholder="Buscar código, marca ou descrição..." autocomplete="off">
</div>

<div class="filters">
  <select id="marcaFilter" class="filter-select">
    <option value="TODAS">Todas as Marcas</option>
  </select>
</div>

<div class="list" id="list"></div>

<div class="empty-state" id="emptyState" hidden>
  <div class="empty-icon">🏷️</div>
  <div class="empty-title">Nenhum preço encontrado</div>
  <div class="empty-desc">Toque em <b>+</b> para cadastrar.</div>
</div>

<div class="fab-group">
  <div class="icons-row">
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sincronizar" title="Sincronizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
      </svg>
    </button>
  </div>
  <button class="fab-register" id="addBtn" type="button" aria-label="Novo Preço" title="Novo Preço">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<!-- MODAL FORM -->
<div class="modal" id="formModal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title" id="formTitle">Novo Preço</h2>
      <button class="modal-close" data-close="formModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab active" data-tab="produto" type="button">Produto</button>
      <button class="modal-tab" data-tab="valores" type="button">Valores</button>
    </div>
    <form id="recordForm" class="modal-body">
      <input type="hidden" id="recordId">

      <section class="tab-pane active" data-pane="produto">
        <div class="field"><label>Marca *</label><input id="modalMarca" type="text" required autocomplete="off"></div>
        <div class="field"><label>Código *</label><input id="modalCodigo" type="text" required autocomplete="off"></div>
        <div class="field"><label>Descrição *</label><input id="modalDescricao" type="text" required></div>
      </section>

      <section class="tab-pane" data-pane="valores">
        <div class="field"><label>Preço (R$) *</label><input id="modalPreco" type="number" step="0.01" min="0.01" required></div>
      </section>
    </form>
    <footer class="modal-foot">
      <button class="btn btn-green" id="btnSubmitForm" type="submit" form="recordForm">Salvar</button>
      <button class="btn btn-red" data-close="formModal" type="button">Cancelar</button>
    </footer>
  </div>
</div>

<!-- MODAL DELETE -->
<div class="modal" id="deleteModal" aria-hidden="true">
  <div class="modal-box modal-confirm" role="dialog" aria-modal="true">
    <button class="modal-close ir-close" data-close="deleteModal" type="button" aria-label="Fechar">✕</button>
    <div class="confirm-msg">Tem certeza que deseja excluir este preço?</div>
    <div class="confirm-actions">
      <button class="btn btn-green" id="confirmDelete" type="button">Sim</button>
      <button class="btn btn-red" data-close="deleteModal" type="button">Não</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/ir-common.js"></script>
<script src="/precos/m/script.js"></script>
</body>
</html>
