<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F7">
    <meta name="color-scheme" content="light only">
    <title>Pedidos de Faturamento</title>
    <link rel="icon" type="image/png" href="/apps/imagens/IR%20ICONE.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/faturamento/m/styles.css">
    <script>const PORTAL_URL = window.location.origin;</script>
</head>
<body>

<div class="search-bar">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input type="search" id="searchInput" placeholder="Pesquisar código ou razão social..." autocomplete="off">
</div>

<div class="filters">
  <select id="filterVendedor" class="filter-select">
    <option value="">Responsável</option>
  </select>
  <select id="filterStatus" class="filter-select">
    <option value="">Todos os Status</option>
    <option value="pendente">Pendente</option>
    <option value="emitida">Emitida</option>
  </select>
</div>

<div class="month-nav">
  <button type="button" id="monthPrev" class="month-arrow" aria-label="Mês anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button type="button" id="calendarBtn" class="month-display" aria-label="Selecionar mês">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span id="currentMonth">Carregando...</span>
  </button>
  <button type="button" id="monthNext" class="month-arrow" aria-label="Próximo mês">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<div class="list" id="list"></div>

<div class="empty-state" id="emptyState" hidden>
  <div class="empty-icon">📄</div>
  <div class="empty-title">Nenhum pedido encontrado</div>
  <div class="empty-desc">Toque em <b>+</b> para cadastrar.</div>
</div>

<div class="fab-group">
  <div class="icons-row">
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sincronizar" title="Sincronizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
      </svg>
    </button>
  </div>
  <button class="fab-register" id="addBtn" type="button" aria-label="Novo Pedido" title="Novo Pedido">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<!-- MODAL: FORM -->
<div class="modal" id="formModal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title" id="formTitle">Novo Pedido</h2>
      <button class="modal-close" data-close="formModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab active" data-tab="geral" type="button">Geral</button>
      <button class="modal-tab" data-tab="faturamento" type="button">Faturamento</button>
      <button class="modal-tab" data-tab="itens" type="button">Itens</button>
      <button class="modal-tab" data-tab="entrega" type="button">Entrega</button>
      <button class="modal-tab" data-tab="transporte" type="button">Transporte</button>
    </div>
    <form id="pedidoForm" class="modal-body">
      <input type="hidden" id="editId" value="">

      <section class="tab-pane active" data-pane="geral">
        <div class="field"><label>Código</label><input type="text" id="codigo" readonly></div>
        <div class="field"><label>Documento</label><input type="text" id="documento"></div>
        <div class="field" id="numeroNFGroup" hidden><label>Nº Nota Fiscal</label><input type="text" id="numeroNF"></div>
        <div class="field"><label>Responsável *</label><input type="text" id="responsavel" readonly></div>
        <div class="field"><label>Data de Registro</label><input type="text" id="dataRegistro" readonly></div>
        <div class="field"><label>Vendedor</label><select id="vendedor"><option value="">Selecione...</option></select></div>
      </section>

      <section class="tab-pane" data-pane="faturamento">
        <div class="field" style="position:relative;">
          <label>CNPJ</label>
          <input type="text" id="cnpj" maxlength="18" placeholder="00.000.000/0000-00" autocomplete="off">
          <div id="cnpjSuggestions" class="cnpj-suggestions"></div>
        </div>
        <div class="field"><label>Razão Social</label><input type="text" id="razaoSocial"></div>
        <div class="field"><label>Inscrição Estadual</label><input type="text" id="inscricaoEstadual"></div>
        <div class="field"><label>Telefone</label><input type="text" id="telefone" maxlength="15"></div>
        <div class="field"><label>Contato</label><input type="text" id="contato"></div>
        <div class="field"><label>E-mail</label><input type="email" id="email"></div>
        <div class="field"><label>Endereço</label><input type="text" id="endereco"></div>
      </section>

      <section class="tab-pane" data-pane="itens">
        <button type="button" class="btn-add-item" id="btnAddItem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Adicionar Item
        </button>

        <div class="items-list" id="itemsList"></div>

        <div class="totals-block">
          <div class="field"><label>Valor Total do Pedido</label><input type="text" id="valorTotalPedido" readonly></div>
          <div class="field"><label>Peso Total (kg)</label><input type="text" id="peso"></div>
          <div class="field"><label>Quantidade Total</label><input type="number" id="quantidade" min="0" step="1" readonly></div>
          <div class="field"><label>Volumes</label><input type="text" id="volumes"></div>
        </div>
      </section>

      <section class="tab-pane" data-pane="entrega">
        <div class="field"><label>Local de Entrega</label><input type="text" id="localEntrega"></div>
        <div class="field"><label>Setor</label><input type="text" id="setor"></div>
      </section>

      <section class="tab-pane" data-pane="transporte">
        <div class="field"><label>Transportadora</label><select id="transportadora"><option value="">Carregando...</option></select></div>
        <div class="field"><label>Valor do Frete (R$)</label><input type="text" id="valorFrete"></div>
        <div class="field"><label>Previsão de Entrega</label><input type="date" id="previsaoEntrega"></div>
      </section>
    </form>
    <footer class="modal-foot">
      <button class="btn btn-green" id="btnSave" type="submit" form="pedidoForm">Salvar</button>
      <button class="btn btn-red" data-close="formModal" type="button">Cancelar</button>
    </footer>
  </div>
</div>

<!-- MODAL: VIEW -->
<div class="modal" id="viewModal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title">Pedido Nº <span id="viewCodigo"></span></h2>
      <button class="modal-close" data-close="viewModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab active" data-vtab="vgeral" type="button">Geral</button>
      <button class="modal-tab" data-vtab="vfaturamento" type="button">Faturamento</button>
      <button class="modal-tab" data-vtab="vitens" type="button">Itens</button>
      <button class="modal-tab" data-vtab="ventrega" type="button">Entrega</button>
      <button class="modal-tab" data-vtab="vtransporte" type="button">Transporte</button>
    </div>
    <div class="modal-body">
      <div class="tab-pane active" data-vpane="vgeral" id="vgeral"></div>
      <div class="tab-pane" data-vpane="vfaturamento" id="vfaturamento"></div>
      <div class="tab-pane" data-vpane="vitens" id="vitens"></div>
      <div class="tab-pane" data-vpane="ventrega" id="ventrega"></div>
      <div class="tab-pane" data-vpane="vtransporte" id="vtransporte"></div>
    </div>
    <footer class="modal-foot">
      <button class="btn btn-red" data-close="viewModal" type="button">Fechar</button>
    </footer>
  </div>
</div>

<!-- MODAL: DELETE -->
<div class="modal" id="deleteModal" aria-hidden="true">
  <div class="modal-box modal-confirm" role="dialog" aria-modal="true">
    <button class="modal-close ir-close" data-close="deleteModal" type="button" aria-label="Fechar">✕</button>
    <div class="confirm-msg" id="deleteMsg">Deseja excluir este pedido?</div>
    <div class="confirm-actions">
      <button class="btn btn-green" id="confirmDeleteBtn" type="button">Sim</button>
      <button class="btn btn-red" data-close="deleteModal" type="button">Não</button>
    </div>
  </div>
</div>

<!-- MODAL: NF (emitir ou editar) -->
<div class="modal" id="nfModal" aria-hidden="true">
  <div class="modal-box modal-confirm" role="dialog" aria-modal="true">
    <button class="modal-close ir-close" data-close="nfModal" type="button" aria-label="Fechar">✕</button>
    <div class="confirm-msg" id="nfMsg">Informe o número da NF:</div>
    <input type="text" id="nfInput" class="nf-input" placeholder="Ex: 3000" autocomplete="off">
    <div class="confirm-actions">
      <button class="btn btn-green" id="confirmNfBtn" type="button">Confirmar</button>
      <button class="btn btn-red" data-close="nfModal" type="button">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: CALENDAR -->
<div class="modal" id="calendarModal" aria-hidden="true">
  <div class="modal-box modal-calendar" role="dialog" aria-modal="true">
    <header class="modal-head">
      <div class="modal-head-spacer"></div>
      <h2 class="modal-head-title">Selecionar Mês</h2>
      <button class="modal-close" data-close="calendarModal" type="button" aria-label="Fechar">✕</button>
    </header>
    <div class="calendar-header">
      <button type="button" id="calendarPrevYear" class="calendar-year-nav" aria-label="Ano anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h3 id="calendarYear">2026</h3>
      <button type="button" id="calendarNextYear" class="calendar-year-nav" aria-label="Próximo ano">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="calendar-months" id="calendarMonths"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/ir-common.js"></script>
<script src="/faturamento/m/script.js"></script>
</body>
</html>
