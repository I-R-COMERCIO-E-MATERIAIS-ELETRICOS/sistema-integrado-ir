<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e8eef4">
    <meta name="color-scheme" content="light">

    <title>Login · Portal</title>

    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png" sizes="32x32"/>
    <link rel="shortcut icon" type="image/png" href="/imagens/logo-navegador.png"/>
    <link rel="apple-touch-icon" href="/imagens/logo-navegador.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/login-e-autenticacao/styles.css">
</head>
<body>

    <main class="login-screen">

        <!-- Cabeçalho: nome à esquerda, aviso à direita -->
        <header class="login-header">
            <span class="login-header-left">IR2 COMÉRCIO E MATERIAIS ELÉTRICOS LTDA</span>
            <span class="login-header-right">Restrito ao uso interno</span>
        </header>

        <!-- Corpo central com o formulário -->
        <section class="login-body">
            <form id="loginForm" class="login-form" novalidate>

                <!-- Usuário -->
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                    </span>
                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Usuário"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           required
                           autofocus>
                </div>

                <!-- Senha -->
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Senha"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Mostrar senha">
                        <!-- Olho aberto -->
                        <svg class="eye eye-show" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- Olho riscado -->
                        <svg class="eye eye-hide" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                            <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                            <line x1="2" y1="2" x2="22" y2="22"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Entrar</button>

            </form>
        </section>

        <!-- Mensagens de erro/aviso — fixadas na parte inferior central -->
        <div id="messageBox" class="message" role="alert"></div>

    </main>

    <script src="/login-e-autenticacao/script.js"></script>
</body>
</html>
