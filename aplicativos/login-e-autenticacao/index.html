<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f8">

    <title>Login · Portal</title>

    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png" sizes="32x32"/>
    <link rel="shortcut icon" type="image/png" href="/imagens/logo-navegador.png"/>
    <link rel="apple-touch-icon" href="/imagens/logo-navegador.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/login-e-autenticacao/styles.css">
</head>
<body>

    <div id="loginScreen" class="login-screen">

        <!-- Linhas animadas (3 horizontais + 3 verticais) -->
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-v"></div>
        <div class="login-line login-line-v"></div>
        <div class="login-line login-line-v"></div>

        <div class="login-card">
            <div class="login-form-area">

                <div id="messageBox" class="message"></div>

                <div class="login-logo-wrapper">
                    <img src="/portal/IR CLARO.png"  alt="IR Comércio e Materiais Elétricos" class="login-logo-light">
                    <img src="/portal/IR ESCURO.png" alt="IR Comércio e Materiais Elétricos" class="login-logo-dark">
                </div>

                <div class="login-portal-headline">IDENTIFIQUE-SE PARA CONTINUAR</div>

                <div class="login-fields">
                    <form id="loginForm" novalidate>
                        <div class="form-group">
                            <label for="username">Usuário</label>
                            <div class="input-icon-wrapper">
                                <span class="input-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <circle cx="12" cy="8" r="4"/>
                                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                                    </svg>
                                </span>
                                <input type="text" id="username" name="username" required autofocus
                                       placeholder="Digite seu usuário" autocomplete="username"
                                       style="padding-left:2.6rem;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Senha</label>
                            <div class="password-container input-icon-wrapper">
                                <span class="input-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                    </svg>
                                </span>
                                <input type="password" id="password" name="password" required
                                       placeholder="Digite sua senha" autocomplete="current-password"
                                       style="padding-left:2.6rem;">
                                <button type="button" class="toggle-password" id="togglePassword">MOSTRAR</button>
                            </div>
                        </div>

                        <button type="submit" class="btn-login" id="loginBtn">ENTRAR</button>
                    </form>
                </div>

            </div>
        </div>

        <div class="login-version-footer">
            © 2026 IR<span style="color: rgba(255, 140, 60, 0.55);">2</span> COMÉRCIO E MATERIAIS ELÉTRICOS LTDA &nbsp;·&nbsp; USO INTERNO
        </div>
    </div>

    <script src="/login-e-autenticacao/script.js"></script>
</body>
</html>
