<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f6">
    <meta name="color-scheme" content="light">

    <title>Login · Portal</title>

    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png" sizes="32x32"/>
    <link rel="shortcut icon" type="image/png" href="/imagens/logo-navegador.png"/>
    <link rel="apple-touch-icon" href="/imagens/logo-navegador.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/login-e-autenticacao/styles.css">
</head>
<body>

    <main class="login-screen">

        <!-- Linhas laranjas animadas (3 horizontais + 3 verticais) -->
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-h"></div>
        <div class="login-line login-line-v"></div>
        <div class="login-line login-line-v"></div>
        <div class="login-line login-line-v"></div>

        <div class="login-container">

            <header class="login-header">
                <p class="login-eyebrow">Portal IR2 · Área do Colaborador</p>
                <h1 class="login-title">ACESSE SUA CONTA</h1>
                <p class="login-subtitle">Identifique-se para continuar.</p>
            </header>

            <form id="loginForm" class="login-form" novalidate>

                <div id="messageBox" class="message" role="alert"></div>

                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="seu.usuario"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="password-wrap">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="••••••••"
                               autocomplete="current-password"
                               required>
                        <button type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Mostrar senha">

                            <!-- Olho fechado (senha oculta) -->
                            <svg class="eye eye-show" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <!-- Olho riscado (senha visível) -->
                            <svg class="eye eye-hide" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" y1="2" x2="22" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">ENTRAR</button>
            </form>

            <footer class="login-footer">
                © 2026 IR2 Comércio e Materiais Elétricos Ltda
            </footer>

        </div>
    </main>

    <script src="/login-e-autenticacao/script.js"></script>
</body>
</html>
