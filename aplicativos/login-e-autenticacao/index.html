<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Login</title>

    <link rel="icon" type="image/png" href="/imagens/aplicativos/logo-navegador.png" sizes="32x32"/>
    <link rel="shortcut icon" type="image/png" href="/imagens/aplicativos/logo-navegador.png"/>
    <link rel="apple-touch-icon" href="/imagens/aplicativos/logo-navegador.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login-e-autenticacao/styles.css">
</head>
<body>

    <main class="login-screen">

        <aside class="login-aside" aria-hidden="true">
            <span class="line line-h"></span>
            <span class="line line-h"></span>
            <span class="line line-h"></span>
            <span class="line line-h"></span>
            <span class="line line-v"></span>
            <span class="line line-v"></span>
            <span class="line line-v"></span>
            <span class="line line-v"></span>
        </aside>

        <section class="login-form-side">
            <div class="login-form-wrapper">

                <div class="logo-box">
                    <img src="/imagens/aplicativos/logo-login.png" alt="I.R. Comércio e Materiais Elétricos">
                </div>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu.email@gmail.com" required autocomplete="email" autofocus>
                    </div>

                    <div class="field">
                        <label for="password">Senha</label>
                        <div class="password-wrap">
                            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
                        </div>
                    </div>

                    <div id="messageBox" class="message" role="alert"></div>

                    <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
                </form>

            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/login-e-autenticacao/script.js"></script>
</body>
</html>
