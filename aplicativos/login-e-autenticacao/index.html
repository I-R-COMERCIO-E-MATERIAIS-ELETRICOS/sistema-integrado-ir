<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F4F5">
    <title>Login · Portal</title>

    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png" sizes="32x32"/>
    <link rel="shortcut icon" type="image/png" href="/imagens/logo-navegador.png"/>
    <link rel="apple-touch-icon" href="/imagens/logo-navegador.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login-e-autenticacao/styles.css">
</head>
<body>
<main class="login-screen">
    <!-- Linhas sutis em movimento (vertical + horizontal) -->
    <div class="line-field" aria-hidden="true"></div>

    <section class="login-content" aria-label="Login">
        <div class="logo-box">
            <img src="/imagens/logo-login.png" alt="I.R. Comércio e Materiais Elétricos">
        </div>

        <h1 class="login-headline">IDENTIFIQUE-SE PARA CONTINUAR</h1>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário"
                       required autocomplete="username" autofocus>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="••••••••"
                           required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword">Mostrar</button>
                </div>
            </div>

            <div id="messageBox" class="message" role="alert"></div>
            <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
        </form>

        <p class="restricted-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
                <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
            </svg>
            <span>Ambiente restrito ao uso interno</span>
        </p>
    </section>
</main>

<script src="/login-e-autenticacao/script.js"></script>
</body>
</html>
