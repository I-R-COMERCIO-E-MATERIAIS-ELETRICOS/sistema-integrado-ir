<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Portal</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/portal/m/styles.css">
</head>
<body>

<div class="m-splash" id="splash">
    <div class="m-splash-inner">
        <div class="m-splash-greeting" id="splashGreeting"></div>
        <div class="m-splash-bar"><span></span></div>
    </div>
</div>

<header class="m-header" id="header" style="display:none">
    <div class="m-user">
        <div class="m-avatar" id="userInitial"></div>
        <div class="m-user-info">
            <div class="m-user-name" id="userName"></div>
            <div class="m-user-sector" id="userSector"></div>
        </div>
    </div>
    <button class="m-logout" onclick="showLogout()" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
    </button>
</header>

<main class="m-content" id="content" style="display:none">
    <h2 class="m-section-title">Módulos</h2>
    <div class="m-modules-grid" id="modulesGrid"></div>
</main>

<div class="m-modal-overlay" id="logoutModal">
    <div class="m-modal">
        <div class="m-modal-message">Deseja realmente sair?</div>
        <div class="m-modal-actions">
            <button class="m-secondary" onclick="closeLogout()">Cancelar</button>
            <button class="m-danger" onclick="confirmLogout()">Sair</button>
        </div>
    </div>
</div>

<script src="/portal/m/script.js"></script>
</body>
</html>
