<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Portal · I.R. Comércio</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/portal/m/styles.css">
</head>
<body>

<div class="m-splash" id="splash">
    <div class="m-splash-inner">
        <div class="m-splash-greeting" id="splashGreeting"></div>
        <div class="m-splash-bar"><span></span></div>
    </div>
</div>

<div class="m-app" id="app" style="display:none">

    <nav class="m-tabs" id="tabsBar">
        <div class="m-tabs-scroll" id="tabsScroll"></div>
    </nav>

    <main class="m-iframe-area" id="iframeArea"></main>
</div>

<div class="m-modal-overlay" id="logoutModal">
    <div class="m-modal">
        <div class="m-modal-message">Deseja realmente sair?</div>
        <div class="m-modal-actions">
            <button class="m-secondary" onclick="closeLogout()">Cancelar</button>
            <button class="m-danger" onclick="confirmLogout()">Sair</button>
        </div>
    </div>
</div>

<script src="/portal/m/script.js"></script>
</body>
</html>
