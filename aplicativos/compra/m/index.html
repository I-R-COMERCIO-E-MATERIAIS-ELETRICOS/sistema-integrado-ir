<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Ordens de Compra</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/compra/m/styles.css">
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>

<header class="m-header">
    <h1>Ordens de Compra</h1>
    <div class="m-header-actions">
        <button class="m-add-btn" onclick="toggleForm()" aria-label="Nova ordem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>

        <button class="m-icon-btn" id="auditBtn" onclick="abrirAuditoria()" title="Relatório de atividades" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="8" y1="13" x2="16" y2="13"></line>
                <line x1="8" y1="17" x2="16" y2="17"></line>
                <line x1="8" y1="9" x2="10" y2="9"></line>
            </svg>
        </button>

        <button class="m-icon-btn" onclick="abrirDuplicar()" title="Duplicar ordem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </button>

        <button class="m-icon-btn" id="syncBtn" onclick="syncData()" title="Sincronizar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
        </button>
    </div>
</header>

<main class="m-content">

    <!-- CARROSSEL DE DASHBOARDS: 3 por página, paginação real -->
    <div class="m-carousel" id="dashCarousel">
        <div class="m-carousel-track" id="dashTrack">
            <div class="m-stat-card">
                <div class="m-stat-icon m-stat-icon-default">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                </div>
                <div class="m-stat-content">
                    <div class="m-stat-value" id="m-total">0</div>
                    <div class="m-stat-label">Total</div>
                </div>
            </div>

            <div class="m-stat-card m-stat-card-success">
                <div class="m-stat-icon m-stat-icon-success">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="m-stat-content">
                    <div class="m-stat-value m-stat-value-success" id="m-fechadas">0</div>
                    <div class="m-stat-label">Fechadas</div>
                </div>
            </div>

            <div class="m-stat-card m-stat-card-warning">
                <div class="m-stat-icon m-stat-icon-warning">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="m-stat-content">
                    <div class="m-stat-value m-stat-value-warning" id="m-abertas">0</div>
                    <div class="m-stat-label">Abertas</div>
                </div>
            </div>

            <div class="m-stat-card m-stat-card-info">
                <div class="m-stat-icon m-stat-icon-info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
                <div class="m-stat-content">
                    <div class="m-stat-value m-stat-value-info" id="m-valor">R$ 0,00</div>
                    <div class="m-stat-label">Total do Mês</div>
                </div>
            </div>
        </div>
        <div class="m-carousel-dots" id="dashDots"></div>
    </div>

    <!-- NAVEGAÇÃO DE MÊS -->
    <div class="m-month-nav">
        <button class="m-month-btn" onclick="changeMonth(-1)" aria-label="Mês anterior">‹</button>
        <span class="m-month-label" id="currentMonth">Carregando...</span>
        <button class="m-month-btn" onclick="changeMonth(1)" aria-label="Próximo mês">›</button>
    </div>

    <div class="m-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search" placeholder="Buscar por Nº, fornecedor..." oninput="filterOrdens()">
    </div>

    <div class="m-filters">
        <select id="filterResponsavel" onchange="filterOrdens()">
            <option value="">Responsável</option>
        </select>
        <select id="filterStatus" onchange="filterOrdens()">
            <option value="">Todos</option>
            <option value="aberta">Aberta</option>
            <option value="fechada">Fechada</option>
        </select>
    </div>

    <div id="ordensList" class="m-list"></div>
</main>

<script src="/compra/m/script.js"></script>
</body>
</html>
