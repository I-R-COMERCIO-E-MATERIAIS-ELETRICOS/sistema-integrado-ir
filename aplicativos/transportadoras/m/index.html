<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <title>Transportadoras</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/transportadoras/m/styles.css">
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>

<header class="m-header">
    <h1>Transportadoras</h1>
    <div class="m-header-actions">
        <button class="m-add-btn" onclick="toggleForm()" aria-label="Nova transportadora">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>

        <button class="m-icon-btn" id="auditBtn" onclick="abrirAuditoria()" title="Relatório de atividades" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="8" y1="13" x2="16" y2="13"></line>
                <line x1="8" y1="17" x2="16" y2="17"></line>
                <line x1="8" y1="9" x2="10" y2="9"></line>
            </svg>
        </button>

        <button class="m-icon-btn" id="syncBtn" onclick="syncData()" title="Sincronizar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
        </button>
    </div>
</header>

<main class="m-content">

    <div class="m-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search" placeholder="Buscar..." oninput="filterTransportadoras()">
    </div>

    <div class="m-month-nav">
        <button class="m-month-btn" onclick="changeMonth(-1)" aria-label="Mês anterior">‹</button>
        <span class="m-month-label" id="currentMonth">Carregando...</span>
        <button class="m-month-btn" onclick="changeMonth(1)" aria-label="Próximo mês">›</button>
    </div>

    <div class="m-filters">
        <select id="filterResponsavel" onchange="filterTransportadoras()">
            <option value="">Responsável</option>
        </select>
    </div>

    <div id="transportadorasList" class="m-list"></div>
</main>

<script src="/transportadoras/m/script.js"></script>
</body>
</html>
