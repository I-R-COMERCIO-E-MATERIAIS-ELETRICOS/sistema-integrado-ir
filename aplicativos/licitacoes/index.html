<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licitações</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/licitacoes/styles.css">
</head>
<body>

<div class="app-content">
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Licitações</h1>
            </div>
            <button onclick="toggleForm()" class="btn-new-order-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nova Licitação
            </button>
        </div>

        <div class="search-bar-wrapper">
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="search" placeholder="Buscar por título..." oninput="filterRows()">
                <button class="icon-btn" onclick="carregar()" title="Sincronizar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6"/>
                        <path d="M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="card table-card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">Cód.</th>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Status</th>
                            <th>Criado em</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="formModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Nova Licitação</h3>
            <button class="close-modal" onclick="fecharForm(true)">✕</button>
        </div>
        <form id="itemForm" onsubmit="handleSubmit(event)">
            <input type="hidden" id="itemId">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="title">Título *</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group full">
                    <label for="description">Descrição</label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="aberta">Aberta</option>
                        <option value="em_analise">Em análise</option>
                        <option value="encerrada">Encerrada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary" onclick="fecharForm(true)">Cancelar</button>
                <button type="submit" class="save">Salvar</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="deleteModal">
    <div class="modal-content small">
        <div class="modal-message-delete">Tem certeza que deseja excluir este registro?</div>
        <div class="modal-actions centered">
            <button type="button" class="success" onclick="confirmarExclusao()">Sim</button>
            <button type="button" class="danger" onclick="fecharExclusao()">Não</button>
        </div>
    </div>
</div>

<script src="/licitacoes/script.js"></script>
</body>
</html>
