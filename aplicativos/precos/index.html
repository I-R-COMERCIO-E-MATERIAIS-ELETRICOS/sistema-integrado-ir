<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Preços</title>
    <link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/precos/styles.css">
    <script>
    (function () {
        const uaMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
        const smallTouch = window.innerWidth <= 900 && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
        if (uaMobile || smallTouch) window.location.replace('/precos/m/');
    })();
    </script>
</head>
<body>

<div class="app-content">
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Tabela de Preços</h1>
            </div>
            <button onclick="toggleForm()" class="btn-new-order-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Novo Preço
            </button>
        </div>

        <div class="search-bar-wrapper">
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="search" placeholder="Buscar por código, marca, descrição ou vendedor..." oninput="filterPrecos()">
                <select id="marcaSelect" class="search-select" onchange="selecionarMarca(this.value)">
                    <option value="TODAS">TODAS AS MARCAS</option>
                </select>
                <button class="icon-btn" id="syncBtn" onclick="sincronizarDados()" title="Sincronizar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6"/>
                        <path d="M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="card table-card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Marca</th>
                            <th>Código</th>
                            <th>Preço</th>
                            <th>Descrição</th>
                            <th>Vendedor</th>
                            <th>Alteração</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="precosTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="formModal">
    <div class="modal-content large">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Novo Preço</h3>
            <button class="close-modal" onclick="fecharForm(true)">✕</button>
        </div>
        <form id="modalPrecoForm" onsubmit="handleSubmit(event)">
            <input type="hidden" id="modalEditId">
            <div class="form-grid">
                <div class="form-group">
                    <label for="modalMarca">Marca *</label>
                    <input type="text" id="modalMarca" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="modalCodigo">Código *</label>
                    <input type="text" id="modalCodigo" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="modalPreco">Preço (R$) *</label>
                    <input type="number" id="modalPreco" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="modalVendedor">Vendedor</label>
                    <input type="text" id="modalVendedor" autocomplete="off" list="vendedoresList">
                    <datalist id="vendedoresList"></datalist>
                </div>
                <div class="form-group full" style="grid-column: 1 / -1;">
                    <label for="modalDescricao">Descrição *</label>
                    <textarea id="modalDescricao" rows="4" required></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary" onclick="fecharForm(true)">Cancelar</button>
                <button type="submit" class="save" id="modalSubmitBtn">Salvar</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="deleteModal">
    <div class="modal-content small">
        <div class="modal-message-delete">Tem certeza que deseja excluir este preço?</div>
        <div class="modal-actions centered">
            <button type="button" class="success" onclick="confirmarExclusao()">Sim</button>
            <button type="button" class="danger" onclick="fecharExclusao()">Não</button>
        </div>
    </div>
</div>

<script src="/precos/script.js"></script>
</body>
</html>
