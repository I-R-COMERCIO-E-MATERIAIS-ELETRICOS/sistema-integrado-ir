<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Tutorial</title>
<link rel="icon" type="image/png" href="/imagens/logo-navegador.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #F4F5F7; color: #111;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

#home { padding: 1.5rem 1rem 3rem; }
#home h1 {
    font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;
    text-align: center; margin-bottom: 0.5rem;
}
#home .sub {
    color: #5B6470; font-size: 0.88rem; text-align: center;
    margin-bottom: 1.75rem; line-height: 1.5;
}

#grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem;
}
.tut-card {
    background: #FFF;
    border: 1px solid #E1E4E8;
    border-radius: 10px;
    padding: 0.75rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-align: left;
    transition: transform 0.1s, border-color 0.15s;
    min-height: 48px;
}
.tut-card:active { transform: scale(0.97); border-color: #9CA3AF; }
.tut-card .ic {
    width: 26px; height: 26px;
    min-width: 26px; min-height: 26px;
    border-radius: 7px;
    background: #F1F3F5; color: #6B7280;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}
.tut-card .ic svg {
    width: 15px; height: 15px;
    max-width: 15px; max-height: 15px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    display: block;
}
.tut-card strong {
    font-size: 0.78rem; font-weight: 600; color: #111;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1; min-width: 0;
}

.modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
    z-index: 10000;
    padding: 1.5rem;
}
.modal.show { display: flex; }
.modal-box {
    background: #FFF;
    border-radius: 16px;
    padding: 1.75rem 1.5rem;
    max-width: 360px; width: 100%;
    text-align: center;
    animation: scaleIn 0.2s ease;
}
@keyframes scaleIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-box h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.6rem; }
.modal-box p { color: #5B6470; font-size: 0.88rem; line-height: 1.6; margin-bottom: 1.5rem; }
.modal-box button {
    background: #3B82F6; color: #fff;
    padding: 0.85rem 1.5rem; border-radius: 10px;
    font-size: 0.9rem; font-weight: 600;
    width: 100%;
}
</style>
</head>
<body>

<div id="home">
    <h1>Tutorial</h1>
    <p class="sub">Escolha um módulo para aprender passo a passo.</p>
    <div id="grid"></div>
</div>

<div class="modal" id="soonModal">
    <div class="modal-box">
        <h2 id="soonTitle">Em breve</h2>
        <p id="soonText">O tutorial interativo deste módulo ainda está em desenvolvimento.</p>
        <button onclick="fecharModal()">Entendi</button>
    </div>
</div>

<script>
var ICONS = {
    usuarios:         '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
    licitacoes:       '<svg viewBox="0 0 24 24"><path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"/><path d="m18 15 4-4"/></svg>',
    precos:           '<svg viewBox="0 0 24 24"><path d="M11 13H7"/><path d="M19 9h-4"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/><rect x="15" y="5" width="4" height="12" rx="1"/><rect x="7" y="8" width="4" height="9" rx="1"/></svg>',
    compra:           '<svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>',
    transportadoras:  '<svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    cotacoes:         '<svg viewBox="0 0 24 24"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/><circle cx="18.5" cy="15.5" r="2.5"/><path d="M20.27 17.27 22 19"/></svg>',
    faturamento:      '<svg viewBox="0 0 24 24"><path d="M4 11V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M2 15h10"/><path d="m9 18 3-3-3-3"/></svg>',
    frete:            '<svg viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>',
    estoque:          '<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    receber:          '<svg viewBox="0 0 24 24"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>',
    pagar:            '<svg viewBox="0 0 24 24"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="M18 12h.01"/><path d="M19 22v-6"/><path d="m22 19-3-3-3 3"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>',
    lucro:            '<svg viewBox="0 0 24 24"><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>'
};

var MODULES = [
    { id: 'usuarios',        name: 'Usuários'                },
    { id: 'licitacoes',      name: 'Licitações'              },
    { id: 'precos',          name: 'Tabela de Preços'        },
    { id: 'compra',          name: 'Ordens de Compra'        },
    { id: 'transportadoras', name: 'Transportadoras'         },
    { id: 'cotacoes',        name: 'Cotações de Frete'       },
    { id: 'faturamento',     name: 'Pedidos de Faturamento'  },
    { id: 'frete',           name: 'Controle de Frete'       },
    { id: 'estoque',         name: 'Estoque'                 },
    { id: 'receber',         name: 'Contas a Receber'        },
    { id: 'pagar',           name: 'Contas a Pagar'          },
    { id: 'lucro',           name: 'Lucro Real'              }
];

function renderHome() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';

    MODULES.forEach(function(m) {
        var card = document.createElement('button');
        card.className = 'tut-card';

        var ic = document.createElement('div');
        ic.className = 'ic';
        ic.innerHTML = ICONS[m.id] || '';

        var strong = document.createElement('strong');
        strong.textContent = m.name;

        card.appendChild(ic);
        card.appendChild(strong);
        card.addEventListener('click', function () { abrirModal(m.name); });
        grid.appendChild(card);
    });
}

function abrirModal(nome) {
    document.getElementById('soonTitle').textContent = nome + ' — Em breve';
    document.getElementById('soonText').textContent = 'O tutorial interativo deste módulo ainda está em desenvolvimento. Avisaremos quando estiver disponível.';
    document.getElementById('soonModal').classList.add('show');
}

function fecharModal() {
    document.getElementById('soonModal').classList.remove('show');
}

document.getElementById('soonModal').addEventListener('click', function(e) {
    if (e.target.id === 'soonModal') fecharModal();
});

document.addEventListener('DOMContentLoaded', renderHome);
</script>
</body>
</html>
