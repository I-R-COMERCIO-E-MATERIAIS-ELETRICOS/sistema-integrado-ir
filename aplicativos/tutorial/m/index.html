<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #F4F5F7; color: #111;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* HOME */
#home { padding: 1.5rem 1rem 3rem; }
#home h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; text-align: center; margin-bottom: 0.5rem; }
#home .sub { color: #5B6470; font-size: 0.9rem; text-align: center; margin-bottom: 2rem; line-height: 1.5; }
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.75rem;
}
.tut-card {
    background: #FFF;
    border: 1px solid #E1E4E8;
    border-radius: 14px;
    padding: 1.25rem 1rem;
    display: flex; flex-direction: column; gap: 0.5rem;
    text-align: left;
    transition: transform 0.1s, border-color 0.15s;
}
.tut-card:active { transform: scale(0.97); border-color: #FF521D; }
.tut-card .ic {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255, 82, 29, 0.10);
    color: #FF521D;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.tut-card .ic svg {
    width: 20px; height: 20px;
    max-width: 20px; max-height: 20px;
    stroke: currentColor; fill: none; stroke-width: 2;
    display: block;
}
.tut-card strong { font-size: 0.92rem; font-weight: 700; }

/* STAGE */
#stage { display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
#toolbar {
    background: #0A0A0A; color: #fff;
    padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.75rem;
    position: sticky; top: 0; z-index: 50;
}
#toolbar .back {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: #fff; font-size: 0.85rem; font-weight: 600;
    padding: 0.4rem 0.75rem; border-radius: 8px;
    background: rgba(255,255,255,0.08);
}
#toolbar .back svg { width: 16px; height: 16px; }
#currentModule { font-size: 0.9rem; font-weight: 600; color: rgba(255,255,255,0.85); }

#moduleArea { flex: 1; padding: 1rem; background: #F4F5F7; }

/* CHAT (overlay) */
#chat {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #FFF;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
    max-height: 65vh;
    display: flex; flex-direction: column;
    z-index: 9000;
    transform: translateY(100%);
    transition: transform 0.3s ease;
}
#chat.open { transform: translateY(0); }
#chatHead {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #E1E4E8;
    flex-shrink: 0;
}
#chatHead .av {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255, 82, 29, 0.10); color: #FF521D;
    display: flex; align-items: center; justify-content: center;
}
#chatHead .av svg { width: 18px; height: 18px; }
#chatHead .title { flex: 1; min-width: 0; }
#chatHead .title strong { font-size: 0.9rem; display: block; }
#chatHead .title span { font-size: 0.72rem; color: #9CA3AF; }
#chatClose { width: 32px; height: 32px; background: #F7F8FA; border-radius: 8px; color: #5B6470; display: flex; align-items: center; justify-content: center; }

#chatBody { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
.msg { max-width: 92%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; }
.msg.tut { background: rgba(255, 82, 29, 0.10); color: #111; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.success { background: rgba(34,197,94,0.12); color: #16A34A; border: 1px solid rgba(34,197,94,0.35); font-weight: 600; align-self: flex-start; }

#chatActions { display: flex; gap: 0.6rem; padding: 0.85rem 1rem 1rem; border-top: 1px solid #E1E4E8; flex-shrink: 0; }
#chatActions button { flex: 1; padding: 0.85rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; }
#prevBtn { background: #F7F8FA; color: #5B6470; border: 1px solid #E1E4E8; }
#nextBtn { background: #FF521D; color: #fff; }
#chatActions button:disabled { opacity: 0.4; }

.tut-hl {
    position: relative; z-index: 8000;
    outline: 3px solid #FF521D; outline-offset: 4px;
    border-radius: 8px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    animation: pulse 1.4s ease-in-out infinite;
}
